<!doctype html>
<html><head><meta charset="utf-8">

<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative;
    background-color: #f6f6f6;

  .br { color: #cee1e8; font-family: 'Inter Tight'; font-weight: 400; }
  p { position: absolute; left: 74px; top: 360px; width: 640px; font-family: 'Newsreader', serif; font-size: 38px; line-height: 1.22; color: #4a5c63; }
  .url { position: absolute; left: 74px; bottom: 60px; font-family: 'Geist Mono'; font-size: 26px; color: #0080bc; font-weight: 500; }
  .pill { position: absolute; font-family: 'Geist Mono'; font-weight: 500; font-size: 30px; padding: 10px 18px; border-radius: 12px; }
  .pathway { position: absolute; right: -40px; bottom: -40px; }
</style></head>
